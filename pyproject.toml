[project]
name = "blendrender"
version = "2.1.0"
description = "Self-contained Blender GPU render node for RunPod"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0,<2",
  "fastapi>=0.116.0,<1",
  "itsdangerous>=2.2.0,<3",
  "pillow>=11.3.0,<13",
  "psutil>=7.0.0,<8",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.40.0,<2",
  "httpx>=0.28.1,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.0,<1",
  "types-psutil>=7.0.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/blendrender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend.blendrender"]
