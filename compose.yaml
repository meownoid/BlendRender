services:
  blendrender:
    build:
      context: .
      platforms: [linux/amd64]
    image: blendrender:local
    ports:
      - "8000:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env or the shell}
      COOKIE_SECURE: "false"
      WORKSPACE_ROOT: /workspace/blendrender
    volumes:
      - ./workspace:/workspace
    gpus: all
    restart: unless-stopped
